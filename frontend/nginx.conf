# Same job as the /api proxy in vite.config.ts, for the Docker setup:
# /api/models in the browser -> http://backend:8000/models
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # the trailing slash on both sides strips the /api prefix
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}