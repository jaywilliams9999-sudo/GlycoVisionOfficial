model_version: clinical-v1
source: data/raw/pima.csv
rename:
  Pregnancies: pregnancies
  Glucose: glucose
  BloodPressure: blood_pressure
  SkinThickness: skin_thickness
  Insulin: insulin
  BMI: bmi
  DiabetesPedigreeFunction: diabetes_pedigree
  Age: age
  Outcome: outcome
target: outcome
features: [pregnancies, glucose, blood_pressure, skin_thickness,
           insulin, bmi, diabetes_pedigree, age]
clean:
  treat_as_missing:
    columns: [glucose, blood_pressure, skin_thickness, insulin, bmi]
    values: [0]
impute:
  strategy: median
  add_indicator: true
split:
  test_size: 0.2
  stratify: true
  random_state: 42
model:
  n_estimators: 300
  random_state: 42
  max_depth: 8
  class_weight: balanced
risk_thresholds:
  moderate: 0.33
  high: 0.66
# Valid ranges per feature. Copied into metadata.json: the API rejects values
# outside them, and the frontend uses them for its form. optional = may be blank.
inputs:
  pregnancies:       {min: 0,   max: 20}
  glucose:           {min: 40,  max: 400, optional: true}
  blood_pressure:    {min: 20,  max: 150, optional: true}
  skin_thickness:    {min: 5,   max: 100, optional: true}
  insulin:           {min: 10,  max: 900, optional: true}
  bmi:               {min: 10,  max: 80,  optional: true}
  diabetes_pedigree: {min: 0,   max: 3}
  age:               {min: 18,  max: 120}