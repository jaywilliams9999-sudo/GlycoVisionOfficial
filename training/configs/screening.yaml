model_version: screening-v1
source: data/raw/brfss.csv
rename:
  Diabetes_binary: diabetes
  HighBP: high_bp
  HighChol: high_chol
  CholCheck: chol_check
  BMI: bmi
  Smoker: smoker
  Stroke: stroke
  HeartDiseaseorAttack: heart_disease
  PhysActivity: phys_activity
  Fruits: fruits
  Veggies: veggies
  HvyAlcoholConsump: heavy_alcohol
  GenHlth: general_health
  MentHlth: mental_health_days
  PhysHlth: physical_health_days
  DiffWalk: diff_walk
  Sex: sex
  Age: age_group
target: diabetes
features: [high_bp, high_chol, chol_check, bmi, smoker, stroke, heart_disease,
           phys_activity, fruits, veggies, heavy_alcohol, general_health,
           mental_health_days, physical_health_days, diff_walk, sex, age_group]
impute:
  strategy: median
  add_indicator: true
split:
  test_size: 0.2
  stratify: true
  random_state: 42
model:
  n_estimators: 300
  random_state: 42
  max_depth: 8
  class_weight: balanced
  n_jobs: -1
risk_thresholds:
  moderate: 0.33
  high: 0.66

# Valid ranges per feature, copied into metadata.json (see clinical.yaml).
# BRFSS codes: 0/1 = no/yes; general_health 1 (excellent) - 5 (poor);
# age_group 1 (18-24) - 13 (80+), in 5-year bands; sex 0 = female, 1 = male.
inputs:
  high_bp:              {min: 0,  max: 1}
  high_chol:            {min: 0,  max: 1}
  chol_check:           {min: 0,  max: 1}
  bmi:                  {min: 12, max: 98}
  smoker:               {min: 0,  max: 1}
  stroke:               {min: 0,  max: 1}
  heart_disease:        {min: 0,  max: 1}
  phys_activity:        {min: 0,  max: 1}
  fruits:               {min: 0,  max: 1}
  veggies:              {min: 0,  max: 1}
  heavy_alcohol:        {min: 0,  max: 1}
  general_health:       {min: 1,  max: 5}
  mental_health_days:   {min: 0,  max: 30}
  physical_health_days: {min: 0,  max: 30}
  diff_walk:            {min: 0,  max: 1}
  sex:                  {min: 0,  max: 1}
  age_group:            {min: 1,  max: 13}